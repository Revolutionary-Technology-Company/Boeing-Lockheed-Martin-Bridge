name: Boeing-Lockheed Martin Bridge CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

     Tar up and establish the isolated execution stack
    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Execute Signal Verification & Parity Unit Tests
      run: |
        python -m unittest test_hex_signals.py

    - name: Rebuild Dimensional Architecture & Markdown Tracking Ledger
      if: success()
      run: |
        python apply_metrics.py

    - name: Commit Updated OpenSCAD Assemblies & Audited Tracking Ledger
      if: success()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add enclosure_mold.scad project_ledger.json TRACKING_LEDGER.md
        # Prevent CI loop break if no design modifications were generated
        git diff-index --quiet HEAD || git commit -m "Auto-compile: Dynamic fitting footprint update [CI]"
        git push origin main
