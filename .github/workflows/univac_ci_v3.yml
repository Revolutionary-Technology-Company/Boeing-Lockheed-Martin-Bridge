name: UNIVAC IX Aerospace Integration CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Linux Core Graphics Tools & OpenSCAD
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends git openssh-client openscad

    - name: Install Framework Core Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pandas numba streamlit textual matplotlib pydantic requests shapely solidpython pytest

    - name: Configure Headless Graphic Environment
      run: |
        echo "MPLBACKEND=Agg" >> $GITHUB_ENV

    - name: Execute Procedural OpenSCAD CAD Compilation Tests
      run: |
        python src/core/generate_saiya_chassis.py

    - name: Execute Multi-Corporate Regression Suite
      run: |
        pytest
