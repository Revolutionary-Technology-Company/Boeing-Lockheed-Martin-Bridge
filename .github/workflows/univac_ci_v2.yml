name: UNIVAC IX Aerospace Integration CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends git openssh-client

    - name: Install Framework Core Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pandas numba streamlit textual matplotlib pydantic requests shapely pytest

    - name: Configure Headless Graphic Environment
      # Forces matplotlib to use the non-interactive 'Agg' backend to safely
      # generate airframe geometry plots without a physical hardware desktop screen.
      run: |
        echo "MPLBACKEND=Agg" >> $GITHUB_ENV

    - name: Execute Multi-Corporate Regression Suite
      run: |
        pytest
